# Baseten Truss: serve the fine-tuned Llama-3.1-8B Say-Do student with vLLM (OpenAI-compatible).
# Weights come from the PRIVATE HF repo written by `modal run deploy/modal_app.py::push_student`.
#   pip install truss && truss push deploy/baseten --publish
# Then in the Baseten UI set autoscaling min replicas = 0 (scale to zero) so idle time costs nothing.
# Verify field names against current Baseten docs (docker_server / vLLM template) before pushing.
model_name: saydo-student
base_image:
  image: vllm/vllm-openai:v0.6.4
docker_server:
  start_command: sh -c "HF_TOKEN=$(cat /secrets/hf_access_token) vllm serve ${STUDENT_REPO} --served-model-name saydo-student --max-model-len 16384 --gpu-memory-utilization 0.92 --enable-prefix-caching"
  readiness_endpoint: /health
  liveness_endpoint: /health
  predict_endpoint: /v1/chat/completions
  server_port: 8000
environment_variables:
  STUDENT_REPO: YOUR_HF_USER/saydo-llama-3.1-8b-student   # private repo
resources:
  accelerator: A10G     # 8B bf16 (~16 GB) fits a 24 GB A10G; use L4/H100 for more throughput
  use_gpu: true
runtime:
  predict_concurrency: 32
secrets:
  hf_access_token: null
